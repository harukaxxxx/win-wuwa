<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wuwa Draw 本機原型</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>Wuwa Draw 本機原型</h1><p>隔離資料測試；登入不會授予主播資格。</p>
<section id="signed-out"><a href="/auth/login">以 Discord 登入</a></section>
<section id="workspace" hidden><p id="permission"></p><form id="editor" hidden><label for="value">本人環境測試文字</label><br><textarea id="value" maxlength="2000" rows="8" cols="40"></textarea><br><button>儲存</button></form><section id="admin" hidden aria-labelledby="admin-title"><h2 id="admin-title">主播資格管理</h2><p>僅管理資格，不能查看其他主播的私人環境。</p><form id="approve"><label for="streamer-id">Discord ID</label> <input id="streamer-id" inputmode="numeric" pattern="[0-9]{1,32}" maxlength="32" required><button>核准新主播</button></form><p id="admin-message" role="status" aria-live="polite"></p><button id="retry-target" type="button" hidden>重試讀取目標</button> <button id="refresh" type="button">重新讀取</button> <button id="more" type="button" hidden>載入更多</button><ul id="streamers"></ul><h3>登入啟動量</h3><p id="usage">讀取中…</p><p>僅顯示 UTC 當日通過站內啟動額度的登入請求；不是 Cloudflare 帳戶用量或剩餘額度。</p></section><button id="logout">登出</button></section><p id="message" role="status"></p></main><script src="/app.js" defer></script></body></html>
